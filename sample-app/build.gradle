// 분석 대상용 예제 서비스: 일부러 오래된 의존성 버전을 고정해 둔다.
// 실제 운영 코드가 아니며, 외부에 배포하지 않는다.
plugins {
    id 'java'
    id 'org.springframework.boot' version '2.6.5'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
}

group = 'com.example'
version = '0.0.1'
java { sourceCompatibility = JavaVersion.VERSION_11 }

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'      // spring-beans 5.3.17, snakeyaml 1.29, jackson 2.13.x 포함
    implementation 'org.apache.logging.log4j:log4j-core:2.14.1'            // 코드에서 사용자 입력을 직접 기록
    implementation 'org.apache.logging.log4j:log4j-api:2.14.1'
    implementation 'org.apache.commons:commons-text:1.9'                   // 코드에서 사용자 입력으로 문자열 치환
    implementation 'commons-collections:commons-collections:3.2.1'         // 선언만 하고 코드에서 쓰지 않음
    runtimeOnly 'com.h2database:h2:1.4.200'                                // 로컬 개발용, 웹 콘솔 꺼져 있음
}
